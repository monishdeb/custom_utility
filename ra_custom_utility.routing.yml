ra_utility.getstates:
  path: '/states/list'
  defaults:
    _controller: '\Drupal\ra_custom_utility\Controller\RaUtilityController::getStates'
  requirements:
    _role: 'ra_member'
ra_utility.upload_tax_doc_member:
  path: '/upload/tax-doc-upload-member/user/{user}'
  defaults:
    _form: '\Drupal\ra_custom_utility\Form\UploadTaxDocMemberForm'
  requirements:
    _access: 'TRUE'
